[mod-setting-description]
enable-normalized-rocket-weight=Sets these items to their vanilla Space Age weight. Without it, a higher production multiplier makes an item lighter, so a rocket carries more of it and of anything made from it

iron-gear-wheel-output-multiplier=Multiplier for Iron Gear Wheel recipes - default 1 per craft, foundry casting 1 per craft
iron-stick-output-multiplier=Multiplier for Iron Stick recipes - default 2 per craft, foundry casting 4 per craft
steel-plate-output-multiplier=Multiplier for Steel Plate recipes - default 1 per craft, foundry casting 1 per craft
concrete-output-multiplier=Multiplier for Concrete recipes - default 10 per craft, foundry casting 10 per craft
engine-unit-output-multiplier=Multiplier for Engine Unit Base Recipe - default 1 per craft
electric-engine-unit-output-multiplier=Multiplier for Electric Engine Unit Base Recipe - default 1 per craft
electronic-circuit-output-multiplier=Multiplier for Electronic Circuit Base Recipe - default 1 per craft
advanced-circuit-output-multiplier=Multiplier for Advanced Circuit Base Recipe - default 1 per craft
processing-unit-output-multiplier=Multiplier for Processing Unit Base Recipe - default 1 per craft
low-density-structure-output-multiplier=Multiplier for Low Density Structure recipes - default 1 per craft, foundry casting 1 per craft
flying-robot-frame-output-multiplier=Multiplier for Flying Robot Frame Base Recipe - default 1 per craft
artificial-yumako-soil-output-multiplier=Multiplier for Artificial Yumako Soil Base Recipe - default 10 per craft
artificial-jellynut-soil-output-multiplier=Multiplier for Artificial Jellynut Soil Base Recipe - default 10 per craft
quantum-processor-output-multiplier=Multiplier for Quantum Processor Base Recipe - default 1 per craft
sulfur-output-multiplier=Multiplier for Sulfur recipes - default 2 per craft, biosulfur 2 per craft

iron-gear-wheel-speed-multiplier=Crafting speed multiplier for Iron Gear Wheel recipes - 1x is the normal crafting time
